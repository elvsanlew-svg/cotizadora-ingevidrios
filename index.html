<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ================= CONSTANTES ================= */
const TURQ = '#00E5FF';
const TITULO = 'SISTEMAS COTIZADOS — INGEVIDRIOS | SUMINISTRO E INSTALACIÓN';
const CONTACTO = 'www.ingevidrios.com | contabilidad@ingevidrios.com | 317 551 8814 | Carrera 53 #72-47';
const LOGOS = ['logo.png', 'Logo_Ingevidrios_Ingevidrios.png'];
const STORE = 'ingevidrios_cotizacion_v1';
const IVA = 19;
const TARIFA_BASE = 1350000;

const NOTA_CONV = '(Mejora de +3 a +4 dB frente a sistemas convencionales)';
const SISTEMAS = [
  { id: 'tairona', nombre: 'Tairona® Batiente/Oscilobatiente', db: '38–41 dB', nota: '',
    func: 'Ventanería batiente y oscilobatiente con ruptura de puente térmico y cierre multipunto; para proyectos residenciales y corporativos que exigen confort térmico y aislamiento del ruido exterior.' },
  { id: 'zinu', nombre: 'Zinu® Batiente', db: '35–38 dB', nota: NOTA_CONV,
    func: 'Ventana batiente termoacústica con herrajes perimetrales y empaques de doble contacto; para fachadas expuestas a ruido urbano y variaciones de temperatura.' },
  { id: 'kymbaya', nombre: 'Kymbaya® Corrediza', db: '33–36 dB', nota: '(Mejora de +3 dB frente a sistemas convencionales)',
    func: 'Ventana y puerta-ventana corrediza termoacústica de deslizamiento suave y gran hermeticidad; para balcones y terrazas con amplios vanos.' },
  { id: 's1101alu', nombre: '1101 Alúmina Termoacústica', db: '28–35 dB', nota: '',
    func: 'Perfilería 1101 con barrera térmica para ventanas batientes y corredizas de uso residencial y comercial con control de temperatura.' },
  { id: 's3831', nombre: '3831 Proyectante', db: '20–32 dB', nota: '',
    func: 'Ventana proyectante con apertura hacia el exterior para ventilación controlada incluso con lluvia; baños, cocinas y zonas de servicio.' },
  { id: 's1101bat', nombre: '1101 Batiente Estándar', db: '20–32 dB', nota: '',
    func: 'Ventana y puerta batiente de línea estándar; solución económica y versátil para vivienda y obras de uso general.' },
  { id: 's1101cor', nombre: '1101 Corredizo Riel', db: '15–24 dB', nota: '',
    func: 'Ventana corrediza sobre riel para espacios sin radio de giro disponible; vivienda y oficinas.' },
  { id: 's1102bat', nombre: '1102 Batiente (3"x1½")', db: '20–32 dB', nota: '',
    func: 'Perfilería de 3" x 1½" para ventanas y puertas batientes de mayor sección y rigidez; vanos medianos y grandes.' },
  { id: 's1102cor', nombre: '1102 Corredizo Riel', db: '15–24 dB', nota: '',
    func: 'Corredizo sobre riel en sección 1102, con mayor rigidez para hojas más altas y pesadas.' },
  { id: 's416', nombre: '416 Esquinero', db: '15–24 dB', nota: '',
    func: 'Sistema de unión en esquina vidrio a vidrio con mínima perfilería visible; ventanales panorámicos y esquinas de fachada.' },
  { id: 's744', nombre: '744 Semi-Pesada', db: '20–30 dB', nota: '',
    func: 'Línea semi-pesada para hojas de gran formato y uso intensivo; comercio, oficinas y edificios institucionales.' },
  { id: 's8025', nombre: '8025 Reforzada', db: '22–32 dB', nota: '',
    func: 'Perfilería reforzada de alta resistencia estructural para grandes luces y exposición a cargas de viento.' },
  { id: 's7038', nombre: '7038 Monumental', db: '24–34 dB', nota: '',
    func: 'Sistema de servicio monumental para fachadas y accesos de gran escala, con alturas y cargas de viento exigentes.' },
];

const VIDRIOS = [
  { id: 'cr4', nombre: 'Crudo 4 mm' },
  { id: 'cr5', nombre: 'Crudo 5 mm' },
  { id: 'cr6', nombre: 'Crudo 6 mm' },
  { id: 'lam33', nombre: 'Laminado 3+3 mm' },
  { id: 'lam44', nombre: 'Laminado 4+4 mm' },
  { id: 'lam44pvb', nombre: 'Laminado 4+4 mm con PVB Acústico 0,76 mm' },
  { id: 't6', nombre: 'Templado 6 mm' },
  { id: 't8', nombre: 'Templado 8 mm' },
  { id: 't10', nombre: 'Templado 10 mm' },
  { id: 'dvh23cr', nombre: 'DVH 23 mm Crudo (4-15-4)' },
  { id: 'dvh23pvb', nombre: 'DVH 23 mm PVB Acústico 0,76 mm (4-13-3+3)' },
  { id: 'dvh25cr', nombre: 'DVH 25 mm Crudo (6-13-6)' },
  { id: 'dvh25t', nombre: 'DVH 25 mm Templado (6-13-6)' },
  { id: 'dvh25pvb', nombre: 'DVH 25 mm PVB Acústico 0,76 mm (6-13-3+3)' },
];

const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const nuevoItem = () => ({ id: Math.random().toString(36).slice(2, 9), ubic: '', sistema: 'tairona', vidrio: 'dvh25pvb', ancho: '', alto: '', cant: '1', tarifa: String(TARIFA_BASE), cNombre: '', cFunc: '' });
const estadoInicial = () => ({
  meta: { proyecto: '', cliente: '', contacto: '', direccion: '', numero: `COT-${new Date().getFullYear()}-001`, vendedor: '', fecha: hoy() },
  items: [nuevoItem()],
  aiu: { on: false, a: '3', i: '3', u: '4' },
  cond: {
    pago: '50% de anticipo para inicio de fabricación y 50% contra entrega / instalación.',
    garantia: '1 año por accesorios y funcionamiento a partir de la fecha de entrega.',
    entrega: '8 a 10 días hábiles después del anticipo y la toma de medidas definitiva.',
    vigencia: '30 días calendario desde la fecha de emisión.',
    transporte: 'Incluidos en los valores cotizados.',
  },
  logo: '',
});
const cargar = () => { try { const j = JSON.parse(localStorage.getItem(STORE)); if (j && j.items) return j; } catch (e) {} return estadoInicial(); };

/* ================= CÁLCULO ================= */
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const cop = n => '$ ' + Math.round(n).toLocaleString('es-CO');
const fm = n => n.toLocaleString('es-CO', { maximumFractionDigits: 2 });
const fechaLarga = f => f ? new Date(f + 'T00:00:00').toLocaleDateString('es-CO', { day: '2-digit', month: 'long', year: 'numeric' }) : '';
const sysDe = it => it.sistema === 'custom'
  ? { id: 'custom', custom: true, nombre: it.cNombre || 'Sistema personalizado', func: it.cFunc || 'Diseño a medida según los requerimientos del proyecto.', db: '', nota: '' }
  : SISTEMAS.find(x => x.id === it.sistema);

function acustica(sys, gl) {
  if (sys.id === 'tairona' && gl.id === 'dvh25pvb') return { rango: '42–45 dB', etiqueta: '(Aumento de +3 a +4 dB / ~40% más silencio)' };
  return { rango: sys.db, etiqueta: sys.nota };
}

function modelo(s) {
  const rows = s.items.map((it, i) => {
    const sys = sysDe(it), gl = VIDRIOS.find(g => g.id === it.vidrio);
    const w = num(it.ancho), h = num(it.alto), q = num(it.cant), t = num(it.tarifa);
    return { it, sys, gl, n: i + 1, ubic: it.ubic, sysName: sys.nombre, glName: gl.nombre, medidas: `${fm(w)} × ${fm(h)}`, cant: q, tarifa: t, valor: Math.max(1.00, w * h) * q * t };
  });

  const grupos = new Map();
  rows.forEach(r => { const k = r.sys.custom ? 'c' + r.it.id : r.sys.id; if (!grupos.has(k)) grupos.set(k, { sys: r.sys, rows: [] }); grupos.get(k).rows.push(r); });
  const fichas = [...grupos.values()].map(({ sys, rows: rs }) => {
    const lines = [`• Funcionalidad / Diseñada para: ${sys.func}`];
    if (sys.db) {
      const u = new Map();
      rs.forEach(r => { const a = acustica(sys, r.gl); const k = a.rango + a.etiqueta; if (!u.has(k)) u.set(k, { ...a, g: [] }); u.get(k).g.push(r.glName); });
      u.forEach(a => lines.push(`• Aislamiento acústico: ${a.rango}${a.etiqueta ? ' ' + a.etiqueta : ''}${u.size > 1 ? ' — ' + [...new Set(a.g)].join('; ') : ''}`));
    }
    return { name: sys.nombre, lines };
  });

  const cd = rows.reduce((a, r) => a + r.valor, 0);
  let desglose;
  if (s.aiu.on) {
    const pa = num(s.aiu.a), pi = num(s.aiu.i), pu = num(s.aiu.u);
    const A = cd * pa / 100, I = cd * pi / 100, U = cd * pu / 100, iva = U * IVA / 100;
    const total = cd + A + I + U + iva;
    desglose = [
      { l: 'Costo Directo', v: cop(cd) },
      { l: `Administración (${pa}%)`, v: cop(A) },
      { l: `Imprevistos (${pi}%)`, v: cop(I) },
      { l: `Utilidad (${pu}%)`, v: cop(U) },
      { l: `IVA (${IVA}% sobre Utilidad)`, v: cop(iva) },
      { l: 'VALOR TOTAL DE LA INVERSIÓN', v: cop(total) },
    ];
    return { rows, fichas, desglose, total };
  }
  const iva = cd * IVA / 100, total = cd + iva;
  desglose = [
    { l: 'Costo Directo', v: cop(cd) },
    { l: `IVA (${IVA}%)`, v: cop(iva) },
    { l: 'VALOR TOTAL DE LA INVERSIÓN', v: cop(total) },
  ];
  return { rows, fichas, desglose, total };
}

const condRows = s => [
  ['Forma de pago', s.cond.pago], ['Garantía', s.cond.garantia], ['Tiempo de entrega', s.cond.entrega],
  ['Vigencia de la oferta', s.cond.vigencia], ['Transporte e instalación', s.cond.transporte],
].filter(r => r[1]);

const metaRows = s => [
  ['Proyecto', s.meta.proyecto, 'No. Cotización', s.meta.numero],
  ['Cliente', s.meta.cliente, 'Fecha', fechaLarga(s.meta.fecha)],
  ['Contacto', s.meta.contacto, 'Vendedor', s.meta.vendedor],
  ['Dirección', s.meta.direccion, '', ''],
];

const waText = (m, s) => [
  '*INGEVIDRIOS*', `Cotización N.º ${s.meta.numero || '—'}`, `Fecha: ${fechaLarga(s.meta.fecha)}`,
  `Cliente: ${s.meta.cliente || '—'}`, `Proyecto: ${s.meta.proyecto || '—'}`, '', '*Desglose financiero (COP)*',
  ...m.desglose.map((d, i) => i === m.desglose.length - 1 ? `*${d.l}: ${d.v}*` : `• ${d.l}: ${d.v}`),
  '', `*Forma de pago:* ${s.cond.pago}`, `*Vigencia:* ${s.cond.vigencia}`, '', CONTACTO,
].join('\n');

/* ================= LOGO ================= */
function cargarLogo(custom) {
  const srcs = custom ? [custom] : LOGOS;
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= srcs.length) return res(null);
      const im = new Image();
      im.onload = () => {
        try {
          const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
          c.getContext('2d').drawImage(im, 0, 0);
          res({ data: c.toDataURL('image/png'), w: c.width, h: c.height });
        } catch (e) { i++; next(); }
      };
      im.onerror = () => { i++; next(); };
      im.src = srcs[i];
    };
    next();
  });
}

function Logo({ custom, h = 36 }) {
  const [i, setI] = useState(0);
  const srcs = custom ? [custom] : LOGOS;
  if (i >= srcs.length) return <span className="font-extrabold tracking-[0.2em]" style={{ color: TURQ, fontSize: h * 0.6 }}>INGEVIDRIOS</span>;
  return <img key={srcs[i]} src={srcs[i]} alt="INGEVIDRIOS" style={{ height: h }} onError={() => setI(i + 1)} />;
}

/* ================= EXPORTAR PDF ================= */
function exportPDF(m, s, logo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 14, K = [0, 0, 0], T = [0, 229, 255];
  doc.setFillColor(...K); doc.rect(0, 0, W, 34, 'F');
  doc.setFillColor(...T); doc.rect(0, 34, W, 1.2, 'F');
  if (logo) { const r = Math.min(55 / logo.w, 18 / logo.h); doc.addImage(logo.data, 'PNG', M, 8, logo.w * r, logo.h * r); }
  else { doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...T); doc.text('INGEVIDRIOS', M, 21); }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...T); doc.text('COTIZACIÓN', W - M, 16, { align: 'right' });
  doc.setFontSize(10); doc.setTextColor(255, 255, 255); doc.text(s.meta.numero || '', W - M, 23, { align: 'right' });

  const base = { margin: { left: M, right: M, bottom: 20 }, styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2, textColor: K, lineColor: [200, 200, 200], lineWidth: 0.1 } };
  const head = { fillColor: K, textColor: T, fontStyle: 'bold' };
  const y = () => doc.lastAutoTable.finalY + 6;

  doc.autoTable({ ...base, startY: 42, theme: 'plain', body: metaRows(s),
    columnStyles: { 0: { fontStyle: 'bold', cellWidth: 28 }, 1: { cellWidth: 63 }, 2: { fontStyle: 'bold', cellWidth: 28 }, 3: { cellWidth: 63 } } });

  const ty = y();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...K); doc.text(TITULO, M, ty);
  doc.setDrawColor(...T); doc.setLineWidth(0.8); doc.line(M, ty + 1.8, W - M, ty + 1.8);

  doc.autoTable({ ...base, startY: ty + 5, theme: 'grid', headStyles: head,
    head: [['#', 'Ubicación / Descripción', 'Sistema', 'Vidrio', 'Medidas (m)', 'Cant.', 'Tarifa m²', 'Valor']],
    body: m.rows.map(r => [r.n, r.ubic, r.sysName, r.glName, r.medidas, r.cant, cop(r.tarifa), cop(r.valor)]),
    styles: { ...base.styles, fontSize: 8 },
    columnStyles: { 0: { cellWidth: 8 }, 4: { cellWidth: 22 }, 5: { cellWidth: 11, halign: 'center' }, 6: { halign: 'right', cellWidth: 24 }, 7: { halign: 'right', cellWidth: 26 } } });

  m.fichas.forEach(f => doc.autoTable({ ...base, startY: y(), theme: 'grid', head: [[f.name]], body: f.lines.map(l => [l]), headStyles: head, rowPageBreak: 'avoid' }));

  doc.autoTable({ ...base, startY: y(), theme: 'grid', head: [[{ content: 'DESGLOSE FINANCIERO (COP)', colSpan: 2 }]], headStyles: head,
    body: m.desglose.map(d => [d.l, d.v]), columnStyles: { 1: { halign: 'right' } },
    didParseCell: d => { if (d.section === 'body' && d.row.index === m.desglose.length - 1) { d.cell.styles.fillColor = T; d.cell.styles.fontStyle = 'bold'; } } });

  const cr = condRows(s);
  if (cr.length) doc.autoTable({ ...base, startY: y(), theme: 'grid', head: [[{ content: 'CONDICIONES COMERCIALES', colSpan: 2 }]], headStyles: head,
    body: cr, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 44 } } });

  let ay = y();
  if (ay + 55 > 277) { doc.addPage(); ay = 20; }
  doc.autoTable({ ...base, startY: ay, theme: 'grid', headStyles: head, rowPageBreak: 'avoid',
    head: [[{ content: 'ACEPTACIÓN DEL CLIENTE', colSpan: 2 }], ['Firma y nombre del cliente', 'C.C. / NIT y fecha de aceptación']],
    body: [['', '']], bodyStyles: { minCellHeight: 28 } });

  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p);
    doc.setDrawColor(...T); doc.setLineWidth(0.6); doc.line(M, 285, W - M, 285);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(70, 70, 70);
    doc.text(CONTACTO, W / 2, 290, { align: 'center' });
    doc.text(`${p} / ${n}`, W - M, 290, { align: 'right' });
  }
  doc.save('cotizacion-ingevidrios.pdf');
}

/* ================= EXPORTAR DOCX ================= */
async function exportDOCX(m, s, logo) {
  const D = window.docx, B = '000000', T = '00E5FF';
  const run = (t, o = {}) => new D.TextRun({ text: String(t), bold: o.b, color: o.c || B, size: o.s || 18, font: 'Arial' });
  const par = (t, o = {}) => new D.Paragraph({ alignment: o.al, spacing: { before: o.sb || 0, after: o.sa === undefined ? 40 : o.sa }, children: [run(t, o)] });
  const none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
  const bd = { style: D.BorderStyle.SINGLE, size: 4, color: 'BBBBBB' };
  const cell = (content, w, o = {}) => new D.TableCell({
    width: { size: w, type: D.WidthType.DXA }, columnSpan: o.span, verticalAlign: D.VerticalAlign.CENTER,
    borders: o.nb ? { top: none, bottom: none, left: none, right: none } : { top: bd, bottom: bd, left: bd, right: bd },
    shading: o.fill ? { type: D.ShadingType.CLEAR, color: 'auto', fill: o.fill } : undefined,
    margins: { top: 60, bottom: 60, left: 90, right: 90 },
    children: Array.isArray(content) ? content : [par(content, { ...o, sa: 0 })],
  });
  const row = (cells, h) => new D.TableRow({ cantSplit: true, height: h ? { value: h, rule: D.HeightRule.ATLEAST } : undefined, children: cells });
  const table = (widths, rows) => new D.Table({ width: { size: widths.reduce((a, b) => a + b, 0), type: D.WidthType.DXA }, columnWidths: widths, rows });
  const gap = (n = 160) => new D.Paragraph({ spacing: { after: n }, children: [] });
  const W = 10100;

  const logoCell = logo
    ? [new D.Paragraph({ children: [new D.ImageRun({ type: 'png', data: Uint8Array.from(atob(logo.data.split(',')[1]), c => c.charCodeAt(0)), transformation: (() => { const r = Math.min(200 / logo.w, 60 / logo.h); return { width: Math.round(logo.w * r), height: Math.round(logo.h * r) }; })() })] })]
    : [par('INGEVIDRIOS', { b: true, c: T, s: 44, sa: 0 })];
  const header = table([5600, 4500], [row([
    cell(logoCell, 5600, { fill: B, nb: true }),
    cell([par('COTIZACIÓN', { b: true, c: T, s: 28, al: D.AlignmentType.RIGHT, sa: 0 }), par(s.meta.numero || '', { c: 'FFFFFF', s: 20, al: D.AlignmentType.RIGHT, sa: 0 })], 4500, { fill: B, nb: true }),
  ])]);
  const bar = table([W], [new D.TableRow({ height: { value: 60, rule: D.HeightRule.EXACT }, children: [cell([new D.Paragraph({ children: [] })], W, { fill: T, nb: true })] })]);

  const meta = table([1500, 3550, 1500, 3550], metaRows(s).map(r => row([
    cell(r[0], 1500, { b: true, nb: true }), cell(r[1], 3550, { nb: true }), cell(r[2], 1500, { b: true, nb: true }), cell(r[3], 3550, { nb: true })])));

  const iw = [450, 2000, 1700, 1800, 1000, 550, 1300, 1300];
  const hdr = ['#', 'Ubicación / Descripción', 'Sistema', 'Vidrio', 'Medidas (m)', 'Cant.', 'Tarifa m²', 'Valor'];
  const items = table(iw, [
    row(hdr.map((h, i) => cell(h, iw[i], { b: true, c: T, fill: B, s: 16 }))),
    ...m.rows.map(r => row([r.n, r.ubic, r.sysName, r.glName, r.medidas, r.cant, cop(r.tarifa), cop(r.valor)].map((v, i) =>
      cell(v, iw[i], { s: 16, al: i >= 6 ? D.AlignmentType.RIGHT : (i === 5 ? D.AlignmentType.CENTER : undefined) })))),
  ]);

  const fichas = m.fichas.flatMap(f => [table([W], [
    row([cell(f.name, W, { b: true, c: T, fill: B })]),
    row([cell(f.lines.map(l => par(l, { s: 17, sa: 30 })), W)]),
  ]), gap(100)]);

  const des = table([6600, 3500], [
    row([cell('DESGLOSE FINANCIERO (COP)', 10100, { span: 2, b: true, c: T, fill: B })]),
    ...m.desglose.map((d, i) => { const last = i === m.desglose.length - 1; return row([cell(d.l, 6600, { b: last, fill: last ? T : undefined }), cell(d.v, 3500, { b: last, fill: last ? T : undefined, al: D.AlignmentType.RIGHT })]); }),
  ]);

  const cr = condRows(s);
  const conds = cr.length ? [gap(), table([2400, 7700], [
    row([cell('CONDICIONES COMERCIALES', 10100, { span: 2, b: true, c: T, fill: B })]),
    ...cr.map(r => row([cell(r[0], 2400, { b: true }), cell(r[1], 7700)])),
  ])] : [];

  const acept = table([5050, 5050], [
    row([cell('ACEPTACIÓN DEL CLIENTE', 10100, { span: 2, b: true, c: T, fill: B })]),
    row([cell('Firma y nombre del cliente', 5050, { b: true, fill: 'EEEEEE' }), cell('C.C. / NIT y fecha de aceptación', 5050, { b: true, fill: 'EEEEEE' })]),
    row([cell('', 5050), cell('', 5050)], 1400),
  ]);

  const docx = new D.Document({
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 700, bottom: 900, left: 900, right: 900 } } },
      footers: { default: new D.Footer({ children: [new D.Paragraph({ alignment: D.AlignmentType.CENTER, border: { top: { style: D.BorderStyle.SINGLE, size: 8, color: T, space: 4 } }, children: [run(CONTACTO, { s: 15, c: '444444' })] })] }) },
      children: [header, bar, gap(120), meta, gap(120), par(TITULO, { b: true, s: 21, sa: 100 }), items, gap(), ...fichas, des, ...conds, gap(240), acept],
    }],
  });
  const blob = await D.Packer.toBlob(docx);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cotizacion-ingevidrios.docx'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================= UI ================= */
const inp = 'w-full bg-[#111] border border-[#2a2a2a] rounded-md px-2.5 py-2 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-[#00E5FF]';
const lab = 'block text-[11px] uppercase tracking-wide text-neutral-400 mb-1';
const F = ({ l, cls = '', children }) => <label className={'block ' + cls}><span className={lab}>{l}</span>{children}</label>;
const Card = ({ title, children }) => (
  <section className="bg-[#0a0a0a] border border-[#1f1f1f] rounded-xl p-4">
    {title && <h2 className="text-sm font-bold tracking-wide mb-3" style={{ color: TURQ }}>{title}</h2>}
    {children}
  </section>
);

function Doc({ m, s }) {
  const th = 'bg-black text-[#00E5FF] font-bold text-left px-2 py-1.5';
  return (
    <div className="bg-white text-black max-w-[820px] mx-auto shadow-xl text-[12px]">
      <div className="bg-black px-5 py-4 flex items-center justify-between border-b-4" style={{ borderColor: TURQ }}>
        <Logo custom={s.logo} h={44} />
        <div className="text-right"><div className="font-bold text-lg" style={{ color: TURQ }}>COTIZACIÓN</div><div className="text-white text-sm">{s.meta.numero}</div></div>
      </div>
      <div className="p-5 space-y-4">
        <div className="grid grid-cols-[auto_1fr] sm:grid-cols-[auto_1fr_auto_1fr] gap-x-3 gap-y-1">
          {metaRows(s).map((r, i) => (
            <React.Fragment key={i}>
              <b>{r[0]}</b><span className="break-words">{r[1]}</span>
              {r[2] ? <><b>{r[2]}</b><span className="break-words">{r[3]}</span></> : <><span className="hidden sm:block" /><span className="hidden sm:block" /></>}
            </React.Fragment>
          ))}
        </div>

        <div>
          <h3 className="font-bold text-[13px] pb-1 border-b-2" style={{ borderColor: TURQ }}>{TITULO}</h3>
          <div className="overflow-x-auto mt-2">
            <table className="w-full border-collapse min-w-[560px]">
              <thead><tr>{['#', 'Ubicación / Descripción', 'Sistema', 'Vidrio', 'Medidas (m)', 'Cant.', 'Tarifa m²', 'Valor'].map(h => <th key={h} className={th}>{h}</th>)}</tr></thead>
              <tbody>
                {m.rows.map(r => (
                  <tr key={r.it.id} className="border-b border-neutral-300 align-top">
                    <td className="px-2 py-1.5">{r.n}</td><td className="px-2 py-1.5">{r.ubic}</td><td className="px-2 py-1.5">{r.sysName}</td>
                    <td className="px-2 py-1.5">{r.glName}</td><td className="px-2 py-1.5 whitespace-nowrap">{r.medidas}</td><td className="px-2 py-1.5 text-center">{r.cant}</td>
                    <td className="px-2 py-1.5 text-right whitespace-nowrap">{cop(r.tarifa)}</td><td className="px-2 py-1.5 text-right whitespace-nowrap font-semibold">{cop(r.valor)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {m.fichas.map((f, i) => (
          <div key={i} className="border border-neutral-300">
            <div className={th}>{f.name}</div>
            <div className="px-2 py-1.5 space-y-1">{f.lines.map((l, j) => <p key={j}>{l}</p>)}</div>
          </div>
        ))}

        <table className="w-full border-collapse border border-neutral-300">
          <thead><tr><th colSpan={2} className={th}>DESGLOSE FINANCIERO (COP)</th></tr></thead>
          <tbody>
            {m.desglose.map((d, i) => { const last = i === m.desglose.length - 1; return (
              <tr key={i} className={'border-t border-neutral-300 ' + (last ? 'font-bold' : '')} style={last ? { background: TURQ } : {}}>
                <td className="px-2 py-1.5">{d.l}</td><td className="px-2 py-1.5 text-right whitespace-nowrap">{d.v}</td>
              </tr>); })}
          </tbody>
        </table>

        {condRows(s).length > 0 && (
          <table className="w-full border-collapse border border-neutral-300">
            <thead><tr><th colSpan={2} className={th}>CONDICIONES COMERCIALES</th></tr></thead>
            <tbody>{condRows(s).map((r, i) => <tr key={i} className="border-t border-neutral-300 align-top"><td className="px-2 py-1.5 font-bold w-1/3">{r[0]}</td><td className="px-2 py-1.5">{r[1]}</td></tr>)}</tbody>
          </table>
        )}

        <table className="w-full border-collapse border border-neutral-300">
          <thead>
            <tr><th colSpan={2} className={th}>ACEPTACIÓN DEL CLIENTE</th></tr>
            <tr className="bg-neutral-200"><th className="px-2 py-1.5 text-left w-1/2">Firma y nombre del cliente</th><th className="px-2 py-1.5 text-left w-1/2">C.C. / NIT y fecha de aceptación</th></tr>
          </thead>
          <tbody><tr><td className="h-24 border border-neutral-300" /><td className="h-24 border border-neutral-300" /></tr></tbody>
        </table>
      </div>
      <div className="border-t-2 px-4 py-2 text-center text-[10px] text-neutral-600" style={{ borderColor: TURQ }}>{CONTACTO}</div>
    </div>
  );
}

function App() {
  const [s, setS] = useState(cargar);
  const [tab, setTab] = useState('edit');
  const [busy, setBusy] = useState('');
  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }, [s]);
  const m = useMemo(() => modelo(s), [s]);

  const setMeta = (k, v) => setS(p => ({ ...p, meta: { ...p.meta, [k]: v } }));
  const setCond = (k, v) => setS(p => ({ ...p, cond: { ...p.cond, [k]: v } }));
  const setAiu = (k, v) => setS(p => ({ ...p, aiu: { ...p.aiu, [k]: v } }));
  const setItem = (id, k, v) => setS(p => ({ ...p, items: p.items.map(it => it.id === id ? { ...it, [k]: v } : it) }));
  const addItem = () => setS(p => ({ ...p, items: [...p.items, { ...nuevoItem(), tarifa: p.items[p.items.length - 1]?.tarifa || String(TARIFA_BASE) }] }));
  const dupItem = id => setS(p => { const i = p.items.findIndex(x => x.id === id); const c = { ...p.items[i], id: nuevoItem().id }; const a = [...p.items]; a.splice(i + 1, 0, c); return { ...p, items: a }; });
  const delItem = id => setS(p => ({ ...p, items: p.items.length > 1 ? p.items.filter(x => x.id !== id) : p.items }));
  const limpiar = () => { if (confirm('¿Iniciar una cotización nueva? Se borrarán los datos actuales.')) setS(p => ({ ...estadoInicial(), logo: p.logo })); };
  const subirLogo = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => setS(p => ({ ...p, logo: r.result })); r.readAsDataURL(f); };

  const exportar = async tipo => {
    setBusy(tipo);
    try { const logo = await cargarLogo(s.logo); tipo === 'pdf' ? exportPDF(m, s, logo) : await exportDOCX(m, s, logo); }
    catch (e) { alert('No se pudo exportar: ' + e.message); }
    setBusy('');
  };
  const Btns = ({ cls = '' }) => (
    <div className={'flex gap-2 ' + cls}>
      <button onClick={() => exportar('pdf')} className="px-3 py-2 rounded-md text-sm font-bold text-black" style={{ background: TURQ }}>{busy === 'pdf' ? '…' : 'PDF'}</button>
      <a href={'https://wa.me/?text=' + encodeURIComponent(waText(m, s))} target="_blank" rel="noopener" className="px-3 py-2 rounded-md text-sm font-bold text-black" style={{ background: '#25d366' }}>WhatsApp</a>
      <button onClick={() => exportar('docx')} className="px-3 py-2 rounded-md text-sm font-bold border" style={{ borderColor: TURQ, color: TURQ }}>{busy === 'docx' ? '…' : 'Word'}</button>
    </div>
  );

  return (
    <div className="min-h-screen bg-black text-white pb-20 lg:pb-0">
      <header className="sticky top-0 z-20 bg-black border-b-2" style={{ borderColor: TURQ }}>
        <div className="flex items-center justify-between px-4 py-2 gap-3">
          <Logo custom={s.logo} h={36} />
          <div className="hidden lg:flex items-center gap-3">
            <div className="text-right"><div className="text-[10px] text-neutral-400 uppercase">Valor total</div><div className="font-bold" style={{ color: TURQ }}>{cop(m.total)}</div></div>
            <Btns />
          </div>
        </div>
        <nav className="lg:hidden grid grid-cols-2">
          {[['edit', 'Editar'], ['prev', 'Vista previa']].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)} className={'py-2 text-sm font-semibold border-b-2 ' + (tab === k ? 'text-[#00E5FF]' : 'text-neutral-400 border-transparent')} style={tab === k ? { borderColor: TURQ } : {}}>{l}</button>
          ))}
        </nav>
      </header>

      <main className="lg:grid lg:grid-cols-2 lg:h-[calc(100vh-61px)]">
        <div className={(tab === 'edit' ? 'block' : 'hidden') + ' lg:block lg:overflow-y-auto p-4 space-y-4'}>
          <Card title="DATOS DE LA COTIZACIÓN">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <F l="Proyecto"><input className={inp} value={s.meta.proyecto} onChange={e => setMeta('proyecto', e.target.value)} /></F>
              <F l="Cliente"><input className={inp} value={s.meta.cliente} onChange={e => setMeta('cliente', e.target.value)} /></F>
              <F l="Contacto"><input className={inp} value={s.meta.contacto} onChange={e => setMeta('contacto', e.target.value)} /></F>
              <F l="Dirección"><input className={inp} value={s.meta.direccion} onChange={e => setMeta('direccion', e.target.value)} /></F>
              <F l="No. Cotización"><input className={inp} value={s.meta.numero} onChange={e => setMeta('numero', e.target.value)} /></F>
              <F l="Vendedor"><input className={inp} value={s.meta.vendedor} onChange={e => setMeta('vendedor', e.target.value)} /></F>
              <F l="Fecha"><input type="date" className={inp} value={s.meta.fecha} onChange={e => setMeta('fecha', e.target.value)} /></F>
              <F l="Logo (opcional)"><input type="file" accept="image/*" onChange={subirLogo} className="text-xs text-neutral-400 file:mr-2 file:rounded file:border-0 file:bg-[#222] file:text-white file:px-2 file:py-1.5" /></F>
            </div>
          </Card>

          {s.items.map((it, idx) => (
            <Card key={it.id} title={`ÍTEM ${idx + 1}`}>
              <div className="grid grid-cols-2 gap-3">
                <F l="Ubicación / Descripción" cls="col-span-2"><input className={inp} value={it.ubic} onChange={e => setItem(it.id, 'ubic', e.target.value)} placeholder="Ej. Alcoba principal — ventana V1" /></F>
                <F l="Sistema" cls="col-span-2">
                  <select className={inp} value={it.sistema} onChange={e => setItem(it.id, 'sistema', e.target.value)}>
                    {SISTEMAS.map(x => <option key={x.id} value={x.id}>{x.nombre}</option>)}
                    <option value="custom">Personalizada</option>
                  </select>
                </F>
                {it.sistema === 'custom' && <>
                  <F l="Nombre del sistema" cls="col-span-2"><input className={inp} value={it.cNombre} onChange={e => setItem(it.id, 'cNombre', e.target.value)} /></F>
                  <F l="Funcionalidad / Diseñada para" cls="col-span-2"><textarea rows={2} className={inp} value={it.cFunc} onChange={e => setItem(it.id, 'cFunc', e.target.value)} /></F>
                </>}
                <F l="Vidrio" cls="col-span-2">
                  <select className={inp} value={it.vidrio} onChange={e => setItem(it.id, 'vidrio', e.target.value)}>
                    {VIDRIOS.map(x => <option key={x.id} value={x.id}>{x.nombre}</option>)}
                  </select>
                </F>
                <F l="Ancho (m)"><input type="number" step="0.01" min="0" inputMode="decimal" className={inp} value={it.ancho} onChange={e => setItem(it.id, 'ancho', e.target.value)} /></F>
                <F l="Alto (m)"><input type="number" step="0.01" min="0" inputMode="decimal" className={inp} value={it.alto} onChange={e => setItem(it.id, 'alto', e.target.value)} /></F>
                <F l="Cantidad"><input type="number" step="1" min="1" inputMode="numeric" className={inp} value={it.cant} onChange={e => setItem(it.id, 'cant', e.target.value)} /></F>
                <F l="Tarifa / m² (COP)"><input inputMode="numeric" className={inp} value={it.tarifa === '' ? '' : Number(it.tarifa).toLocaleString('es-CO')} onChange={e => setItem(it.id, 'tarifa', e.target.value.replace(/\D/g, ''))} /></F>
              </div>
              <div className="flex items-center justify-between mt-3">
                <div className="font-bold" style={{ color: TURQ }}>{cop(m.rows[idx].valor)}</div>
                <div className="flex gap-2 text-xs">
                  <button onClick={() => dupItem(it.id)} className="px-2.5 py-1.5 rounded border border-[#333] text-neutral-300">Duplicar</button>
                  <button onClick={() => delItem(it.id)} disabled={s.items.length < 2} className="px-2.5 py-1.5 rounded border border-[#333] text-red-400 disabled:opacity-30">Eliminar</button>
                </div>
              </div>
            </Card>
          ))}
          <button onClick={addItem} className="w-full py-3 rounded-xl border-2 border-dashed font-semibold" style={{ borderColor: TURQ, color: TURQ }}>+ Agregar ítem</button>

          <Card title="ESQUEMA AIU">
            <button type="button" onClick={() => setAiu('on', !s.aiu.on)} className="flex items-center gap-3 w-full text-left">
              <span className="relative inline-block w-11 h-6 rounded-full transition-colors" style={{ background: s.aiu.on ? TURQ : '#333' }}>
                <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: s.aiu.on ? 22 : 2 }} />
              </span>
              <span className="text-sm font-semibold">⚡ Activar Esquema AIU</span>
            </button>
            {s.aiu.on && (
              <div className="grid grid-cols-3 gap-3 mt-3">
                {[['a', 'Admin. %'], ['i', 'Imprevistos %'], ['u', 'Utilidad %']].map(([k, l]) => (
                  <F key={k} l={l}><input type="number" step="0.1" min="0" className={inp} value={s.aiu[k]} onChange={e => setAiu(k, e.target.value)} /></F>
                ))}
                <p className="col-span-3 text-xs text-neutral-500">IVA {IVA}% aplicado únicamente sobre la Utilidad.</p>
              </div>
            )}
          </Card>

          <Card title="CONDICIONES COMERCIALES">
            <div className="space-y-3">
              {[['pago', 'Forma de pago'], ['garantia', 'Garantía'], ['entrega', 'Tiempo de entrega'], ['vigencia', 'Vigencia de la oferta'], ['transporte', 'Transporte e instalación']].map(([k, l]) => (
                <F key={k} l={l}><textarea rows={2} className={inp} value={s.cond[k]} onChange={e => setCond(k, e.target.value)} /></F>
              ))}
            </div>
          </Card>

          <button onClick={limpiar} className="text-xs text-neutral-500 underline pb-4">Nueva cotización</button>
        </div>

        <div className={(tab === 'prev' ? 'block' : 'hidden') + ' lg:block lg:overflow-y-auto bg-neutral-900 p-3'}>
          <Doc m={m} s={s} />
        </div>
      </main>

      <div className="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-black border-t-2 px-4 py-2 flex items-center justify-between" style={{ borderColor: TURQ }}>
        <div><div className="text-[10px] text-neutral-400 uppercase">Valor total</div><div className="font-bold" style={{ color: TURQ }}>{cop(m.total)}</div></div>
        <Btns />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
